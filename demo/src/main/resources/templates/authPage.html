<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authorisation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="p-3 mb-2 bg-info-subtle text-info-emphasis"></div>

<hr>
<h1>Authorisation Page</h1>
<hr>

<div class="p-3 mb-2 bg-info-subtle text-info-emphasis"></div>
<div class="p-3 mb-2 bg-success-subtle text-success-emphasis"></div>

<form method="post" action="/authMethod">
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Your login</label>
        <input type="text" class="form-control" id="exampleInputEmail1" name="login" required>
    </div>
    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Your password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Accept Info</button>
</form>

<hr>
<div class="p-3 mb-2 bg-danger-subtle text-danger-emphasis"></div>

<hr>
<h1>Registration</h1>
<hr>
<a href="http://localhost:8080/getRegPage"><h2>Click here for registration</h2></a>

<div class="p-3 mb-2 bg-danger-subtle text-danger-emphasis"></div>
</body>
</html>
