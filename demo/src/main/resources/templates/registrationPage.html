<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="75" aria-valuemin="0"
     aria-valuemax="100">
    <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%"></div>
</div>
<hr>
<h1>Enter new login and password to create your account</h1>
<hr>

<div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="75"
     aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%"></div>
</div>

<form method="post" action="/registration">
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Your login</label>
        <input type="text" class="form-control" id="exampleInputEmail1" name="login" required>
    </div>
    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Your password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Accept</button>
</form>
</body>
</html>
